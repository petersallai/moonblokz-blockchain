[package]
name = "moonblokz-blockchain"
version = "0.1.0"
edition = "2024"
description = "MoonBlokz blockchain interpretation crate (no_std, no-alloc"
license = "MIT"
repository = "https://github.com/petersallai/moonblokz-blockchain"
keywords = ["embedded", "no-std", "blockchain", "moonblokz"]
categories = ["embedded", "no-std"]

[dependencies]
# The crypto backend is not pinned per-dependency; it is selected once by this
# crate's `[features]` default and forwarded down (below). No *storage* backend
# is chosen here: this crate only consumes `StorageTrait`, and the backend is the
# final binary's choice (the node firmware's `backend-rp2040`, a host test's
# `backend-memory`). Enabling one here would collide with the binary's.
moonblokz-chain-types = { path = "../moonblokz-chain-types", default-features = false }
moonblokz-configuration = { path = "../moonblokz-configuration", default-features = false }
moonblokz-storage = { path = "../moonblokz-storage", default-features = false }
moonblokz-crypto = { path = "../moonblokz-crypto-lib", default-features = false }
moonblokz-vote = { path = "../moonblokz-vote", default-features = false }
rand_xoshiro = { version = "0.7", default-features = false }

# Test-only: turns on `moonblokz-vote`'s by-value `VoteEngine::new()` oracle
# and its `PartialEq`, so `Blockchain::new()` (the executable specification of
# `Blockchain::init`) can be written as a plain struct literal and compared
# field by field. Never part of a production build.
[dev-dependencies]
moonblokz-vote = { path = "../moonblokz-vote", default-features = false, features = ["test-oracle"] }
# The tests' storage is the in-memory backend.
moonblokz-storage = { path = "../moonblokz-storage", default-features = false, features = ["backend-memory"] }

[features]
# The signature scheme for the whole stack is selected here at the top of the
# graph and forwarded to every crate that carries one (vote, configuration,
# chain-types, crypto, storage). The features name the scheme (DEC-246); choose
# exactly one, the default is `schnorr` (BIP-340). Storage's `backend-memory`
# storage backend stays enabled directly — it is orthogonal to this choice.
default = ["schnorr", "block-size-2016"]
block-size-2016 = [
    "moonblokz-vote/block-size-2016",
    "moonblokz-configuration/block-size-2016",
    "moonblokz-chain-types/block-size-2016",
    "moonblokz-storage/block-size-2016",
]
block-size-65536 = [
    "moonblokz-vote/block-size-65536",
    "moonblokz-configuration/block-size-65536",
    "moonblokz-chain-types/block-size-65536",
    "moonblokz-storage/block-size-65536",
]
schnorr = [
    "moonblokz-vote/schnorr",
    "moonblokz-configuration/schnorr",
    "moonblokz-chain-types/schnorr",
    "moonblokz-crypto/schnorr",
    "moonblokz-storage/schnorr",
]
bls-min-sig = [
    "moonblokz-vote/bls-min-sig",
    "moonblokz-configuration/bls-min-sig",
    "moonblokz-chain-types/bls-min-sig",
    "moonblokz-crypto/bls-min-sig",
    "moonblokz-storage/bls-min-sig",
]
bls-min-pk = [
    "moonblokz-vote/bls-min-pk",
    "moonblokz-configuration/bls-min-pk",
    "moonblokz-chain-types/bls-min-pk",
    "moonblokz-crypto/bls-min-pk",
    "moonblokz-storage/bls-min-pk",
]

# Debug test runs build the curve code optimized (DEC-255): a BLS pairing in an
# unoptimized build is very slow. Only takes effect when this crate is the Cargo root.
[profile.dev.package.moonblokz-crypto]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.bls12_381]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.pairing]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
